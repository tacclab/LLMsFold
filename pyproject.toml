[project]
name = "molgen-framework"
version = "0.1.0"
description = "AI Molecular Generation Framework (LLMsFold)"
readme = "README.md"
license = "LICENSE.md"
requires-python = ">=3.12"
dependencies = [
    "deepchem>=2.8.0",
    "groq>=1.0.0",
    "httpx>=0.28.1",
    "lightning>=2.6.0",
    "pandas>=2.3.3",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "prody>=2.6.1",
    "rdkit>=2025.9.3",
    "tenacity",
    "torch>=2.9.1",
    "torch-geometric>=2.7.0",
    "transformers>=4.57.3",
    "tqdm>=4.67.1",
    "neoralab-sascorer>=0.1.5",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["src.chemistry", "src.nvidia_client"]
disable_error_code = ["attr-defined"]
